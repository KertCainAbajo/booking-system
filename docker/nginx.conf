server {
    listen __PORT__ default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Built CSS/JS have a hash in the name, so they can be cached for a long time
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker must always be fresh so alert fixes reach phones quickly
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Never serve hidden files (.env, .git, ...)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
