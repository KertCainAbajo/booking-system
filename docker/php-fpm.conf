[www]
; Pass Render's environment variables through to PHP
clear_env = no
; Small worker pool: Render's free plan has 512 MB of memory
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
